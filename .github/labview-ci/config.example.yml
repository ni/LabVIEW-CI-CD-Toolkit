# .github/labview-ci.yml - LabVIEW CI configuration (example)
#
# This file is written by the installer to record what was installed, and is the
# single place to review/repin the configuration for this repo. The workflows
# themselves read their settings at runtime from their CI provider context and
# provider variables, all of which have safe fallbacks - so this file is a
# human-facing record, not a hard dependency.
#
# Everything below is OPTIONAL. With nothing set, the pipeline uses sensible
# defaults: LabVIEW 2026, an image named "<repo>-labview", and a provider Pages
# site (GitHub's default is https://<owner>.github.io/<repo>).

schemaVersion: 1

# Where the tooling was installed from. Used by `install.py` and the bootstrappers
# for re-runs/upgrades.
source:
  repo: elijah286/LabVIEW-CI-with-Containers
  ref: main
  # The bootstrap distribution is recorded so `install.sh --update` and
  # `install.ps1 --update` refetch tooling from the same origin. GitLab mirror
  # installs record host: gitlab and their GitLab project here instead.
  distribution:
    host: github
    repo: elijah286/LabVIEW-CI-with-Containers
    ref: main
    url: https://github.com

config:
  # LabVIEW year. Drives the in-container LabVIEW.exe path and the image tag.
  # GitHub: pin it with the Actions variable LABVIEW_VERSION. GitLab: override
  # LVCI_LABVIEW_VERSION as a CI/CD variable.
  labviewVersion: "2026"

  # Default branch the push-triggered workflows watch.
  branch: main

  # Operating systems the analysis jobs run on.
  os: [windows, linux]

  # Optional GitHub GHCR image-name override (default: "<repo>-labview").
  # To pin it for GitHub CI, set the Actions variable LABVIEW_IMAGE_NAME. GitLab
  # uses its project registry; set LVCI_WINDOWS_IMAGE or LVCI_LINUX_IMAGE there.
  # imageName: my-labview-ci

  # Worker container (optional, GitHub workflows). Choose which prebuilt GHCR
  # image CI runs in and the VIPC dependency files baked into it. GitLab native
  # templates use their project registry and LVCI_* CI/CD variables instead.
  container:
    # Default image tag every container action uses: "latest" (recommended;
    # tracks your newest build), a pinned per-content tag (e.g. win-ab12cd34ef56),
    # the LabVIEW year, or "base" for the bare NI image.
    use: latest

    # VIPC dependency files monitored by the Dependencies page. Monitored files
    # produce dependency warnings when packages are missing; monitor: true also
    # opts that file into automatic worker rebuilds when it changes. monitor: false
    # keeps the file visible in config without warnings or automatic rebuilds.
    vipc:
      - path: "Dependencies.vipc"
        monitor: false

    # Dragon (JKI Dragon / NIPM) dependency files monitored by the
    # Dependencies page. monitor: true participates in warnings, dependency
    # builds, and automatic rebuilds on change; monitor: false keeps the file
    # visible without warnings or automatic rebuilds.
    # dragon:
    #   - path: "Project.dragon"
    #     monitor: false

    # Per-action container overrides (optional). Each container action can run in
    # a different image than the default above: "latest", a pinned build tag, the
    # LabVIEW year, or "base" (the bare NI image, no baked deps). Anything not
    # listed uses `use`. Linux jobs use the shared Linux worker for empty/latest
    # selections; choose "base" or "none" only when you explicitly want the bare
    # NI image without baked VIPC dependencies.
    actions:
      masscompile: latest
      vi-analyzer: latest
      vidiff: base

# Installed capabilities (see .github/labview-ci/catalog.json for the full list).
# Capabilities the catalog marks `required` are installed in every repository and
# are added back on the next install or update even if you delete them here.
activities:
  - dashboard
  - masscompile
  - vi-analyzer
  - vidiff
  - snapshots-2

# ----------------------------------------------------------------------------
# GitHub Actions variables the GitHub workflows honor at runtime (set with
# `gh variable set`):
#
#   gh variable set LABVIEW_VERSION    -b 2026
#   gh variable set LABVIEW_IMAGE_NAME -b my-labview-ci      # optional
#   gh variable set PAGES_URL          -b https://ci.example.com   # custom domain
#
# None are required; each falls back to a value derived from the repository.
# GitLab users set equivalent overrides in Settings > CI/CD > Variables, notably
# LVCI_WINDOWS_RUNNER_TAG, LVCI_LINUX_RUNNER_TAG, LVCI_WINDOWS_IMAGE,
# LVCI_LINUX_IMAGE, and LVCI_CONTAINER_RELEASE.
# ----------------------------------------------------------------------------
