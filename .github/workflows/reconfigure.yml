name: Reconfigure LabVIEW CI
run-name: Reconfigure LabVIEW CI - ${{ github.event_name == 'workflow_dispatch' && 'manual run' || github.sha }}

# Applies a settings change from the Configure tool (or a manual dispatch) by
# rewriting .github/labview-ci.yml + toggling container dependencies, then opening
# a pull request. Nothing is applied until you review and merge the PR — and it
# uses GitHub's own auth, so no tokens ever touch the browser.

on:
  workflow_dispatch:
    inputs:
      labview_version:
        description: 'LabVIEW year (e.g. 2026; blank = keep current)'
        required: false
        default: ''
      operating_systems:
        description: 'Which platforms the pipeline targets (keep = leave unchanged)'
        type: choice
        options: [keep, both, windows, linux]
        default: keep
      antidoc:
        description: 'Bake Antidoc (Wovalab doc generation) into the worker image (keep = leave unchanged)'
        type: choice
        options: [keep, 'true', 'false']
        default: keep
      concurrent_runners:
        description: 'Per-repo cap on parallel CI jobs (blank = keep current). GitHub limits concurrency per ACCOUNT (Free 20, Pro 40, Team 60, Enterprise 500) shared across all your repos, so keep it modest.'
        required: false
        default: ''
      activities:
        description: 'Comma-separated capability ids (blank = keep current)'
        required: false
        default: ''
      container_use:
        description: 'Container image tag CI activities use (e.g. latest, win-<hash>, 2026; blank = keep current)'
        required: false
        default: ''
      container_vipc:
        description: 'Monitored VIPC files as path::platforms pairs separated by ; (platforms joined by +, e.g. windows+linux, or "none"; legacy true/false accepted; blank = keep current)'
        required: false
        default: ''
      container_dragon:
        description: 'Monitored Dragon (NIPM) files as path::platforms pairs separated by ; (platforms joined by +, e.g. windows+linux, or "none"; legacy true/false accepted; blank = keep current)'
        required: false
        default: ''
      container_actions:
        description: 'Per-action container overrides as id::tag pairs separated by ; (e.g. masscompile::latest;vidiff::base; blank = keep current)'
        required: false
        default: ''
      action_triggers:
        description: 'Per-activity submission triggers as id::sources pairs separated by ; (sources joined by +, e.g. snapshots::push-default+pr-branch; use "none" to disable an activity; blank = keep current)'
        required: false
        default: ''
      vi_browser:
        description: 'VI Browser render matrix as classic::<oses>;positionAware::<oses> (oses joined by +, e.g. positionAware::windows+linux; "none" to disable a generation; blank = keep current)'
        required: false
        default: ''
      action_os:
        description: 'Per-action platforms as id::oses pairs separated by ; (oses joined by +, e.g. masscompile::windows+linux;snapshots::windows; "none" to run nowhere; blank = keep current)'
        required: false
        default: ''
      require_dependencies:
        description: 'Require all monitored dependencies to be installed before running actions (keep = leave unchanged)'
        type: choice
        options: [keep, 'true', 'false']
        default: keep
      auto_install_dependencies:
        description: 'Automatically install missing monitored dependencies and rebuild containers before running actions (keep = leave unchanged)'
        type: choice
        options: [keep, 'true', 'false']
        default: keep
      via_default:
        description: 'VI Analyzer default test configuration: builtin (full suite), none (skip unmatched VIs), or a committed .viancfg path (blank = keep current)'
        required: false
        default: ''
      via_rules:
        description: 'VI Analyzer per-path configs as <config>::<paths> pairs separated by ; (paths joined by |; config "none" excludes; blank = keep current)'
        required: false
        default: ''
      builds:
        description: 'Build specifications to run: "all" (build every spec, the default) or <project>::<name>::<oses> pairs separated by ; (oses joined by +, e.g. example/App.lvproj::My App::windows+linux; "none" to skip; blank = keep current)'
        required: false
        default: ''
      unit_tests:
        description: 'Unit-test tool config as JSON; blank = keep current'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: labview-ci-reconfigure
  cancel-in-progress: false

jobs:
  reconfigure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Apply settings to config files
        env:
          IN_VERSION: ${{ inputs.labview_version }}
          IN_OS: ${{ inputs.operating_systems }}
          IN_ANTIDOC: ${{ inputs.antidoc }}
          IN_RUNNERS: ${{ inputs.concurrent_runners }}
          IN_ACTS: ${{ inputs.activities }}
          IN_CONTAINER_USE: ${{ inputs.container_use }}
          IN_CONTAINER_VIPC: ${{ inputs.container_vipc }}
          IN_CONTAINER_DRAGON: ${{ inputs.container_dragon }}
          IN_CONTAINER_ACTIONS: ${{ inputs.container_actions }}
          IN_ACTION_TRIGGERS: ${{ inputs.action_triggers }}
          IN_VI_BROWSER: ${{ inputs.vi_browser }}
          IN_ACTION_OS: ${{ inputs.action_os }}
          IN_REQUIRE_DEPS: ${{ inputs.require_dependencies }}
          IN_AUTO_INSTALL_DEPS: ${{ inputs.auto_install_dependencies }}
          IN_VIA_DEFAULT: ${{ inputs.via_default }}
          IN_VIA_RULES: ${{ inputs.via_rules }}
          IN_BUILDS: ${{ inputs.builds }}
          IN_UNIT_TESTS: ${{ inputs.unit_tests }}
        run: |
          python3 - <<'PY'
          import os, re, json, datetime, pathlib

          ver_in  = os.environ['IN_VERSION'].strip()
          oss     = os.environ['IN_OS'].strip()
          antidoc_in = os.environ['IN_ANTIDOC'].strip().lower()
          runners = os.environ['IN_RUNNERS'].strip()
          acts_in = os.environ['IN_ACTS'].strip()
          container_use_in = os.environ.get('IN_CONTAINER_USE', '').strip()
          container_vipc_in = os.environ.get('IN_CONTAINER_VIPC', '').strip()
          container_dragon_in = os.environ.get('IN_CONTAINER_DRAGON', '').strip()
          container_actions_in = os.environ.get('IN_CONTAINER_ACTIONS', '').strip()
          action_triggers_in = os.environ.get('IN_ACTION_TRIGGERS', '').strip()
          vi_browser_in = os.environ.get('IN_VI_BROWSER', '').strip()
          action_os_in = os.environ.get('IN_ACTION_OS', '').strip()
          require_deps_in = os.environ.get('IN_REQUIRE_DEPS', '').strip().lower()
          auto_install_in = os.environ.get('IN_AUTO_INSTALL_DEPS', '').strip().lower()
          via_default_in = os.environ.get('IN_VIA_DEFAULT', '').strip()
          via_rules_in = os.environ.get('IN_VIA_RULES', '').strip()
          builds_in = os.environ.get('IN_BUILDS', '').strip()
          unit_tests_in = os.environ.get('IN_UNIT_TESTS', '').strip()

          # Preserve provenance fields from any existing manifest.
          mpath = pathlib.Path('.github/labview-ci.yml')
          prev = {'activities': [], 'installedVersion': '', 'repo': '', 'ref': 'main',
                  'container_use': '', 'vipc': [], 'dragon': [], 'actions': {}, 'triggers': {}, 'viBrowser': {}, 'actionOs': {}, 'dependencyPolicy': {}, 'unitTests_block': [],
                  'labviewVersion': '', 'os': [], 'maxParallel': None}
          if mpath.exists():
              in_acts = False; in_container = False; in_vipc = False; in_actions = False; in_triggers = False; in_vibrowser = False; in_action_os = False; in_dep_policy = False; in_ut = False; cur_vipc = None
              for line in mpath.read_text(encoding='utf-8').splitlines():
                  if re.match(r'^\s*activities:\s*$', line):
                      in_acts = True; in_container = False; in_vipc = False; in_actions = False; in_triggers = False; in_vibrowser = False; in_action_os = False; in_dep_policy = False; continue
                  if re.match(r'^\s*container:\s*$', line):
                      in_container = True; in_acts = False; in_vipc = False; in_actions = False; in_triggers = False; in_vibrowser = False; in_action_os = False; in_dep_policy = False; continue
                  if re.match(r'^\s*triggers:\s*$', line):
                      in_triggers = True; in_acts = False; in_container = False; in_vipc = False; in_actions = False; in_vibrowser = False; in_action_os = False; in_dep_policy = False; continue
                  if re.match(r'^\s*viBrowser:\s*$', line):
                      in_vibrowser = True; in_acts = False; in_container = False; in_vipc = False; in_actions = False; in_triggers = False; in_action_os = False; in_dep_policy = False; continue
                  if re.match(r'^\s*actionOs:\s*$', line):
                      in_action_os = True; in_acts = False; in_container = False; in_vipc = False; in_actions = False; in_triggers = False; in_vibrowser = False; in_dep_policy = False; continue
                  if re.match(r'^\s*dependencyPolicy:\s*$', line):
                      in_dep_policy = True; in_action_os = False; in_acts = False; in_container = False; in_vipc = False; in_actions = False; in_triggers = False; in_vibrowser = False; continue
                  if re.match(r'^unitTests:\s*$', line):
                      in_ut = True; in_acts = False; in_container = False; in_vipc = False; in_actions = False; in_triggers = False; in_vibrowser = False
                      prev['unitTests_block'] = [line]; continue
                  if in_ut:
                      if re.match(r'^\s+\S', line):
                          prev['unitTests_block'].append(line); continue
                      in_ut = False
                  if in_acts:
                      m = re.match(r'^\s*-\s*(\S+)', line)
                      if m: prev['activities'].append(m.group(1)); continue
                      in_acts = False
                  if in_triggers:
                      m = re.match(r'^\s{4}([A-Za-z0-9_.\-]+):\s*(\S+)', line)
                      if m: prev['triggers'][m.group(1)] = m.group(2); continue
                      if re.match(r'^\s{0,3}\S', line): in_triggers = False
                  if in_vibrowser:
                      m = re.match(r'^\s{4}(classic|positionAware):\s*(\S+)', line)
                      if m: prev['viBrowser'][m.group(1)] = m.group(2); continue
                      if re.match(r'^\s{0,3}\S', line): in_vibrowser = False
                  if in_action_os:
                      m = re.match(r'^\s{4}([A-Za-z0-9_.\-]+):\s*(\S+)', line)
                      if m: prev['actionOs'][m.group(1)] = m.group(2); continue
                      if re.match(r'^\s{0,3}\S', line): in_action_os = False
                  if in_dep_policy:
                      m = re.match(r'^\s{4}(requireInstalled|autoInstall):\s*(\S+)', line)
                      if m: prev['dependencyPolicy'][m.group(1)] = m.group(2); continue
                      if re.match(r'^\s{0,3}\S', line): in_dep_policy = False
                  if in_container:
                      m = re.match(r'^\s{4}use:\s*"?([^"\s]+)"?', line)
                      if m: prev['container_use'] = m.group(1); in_vipc = False; in_actions = False; continue
                      if re.match(r'^\s{4}vipc:\s*$', line): in_vipc = True; in_actions = False; continue
                      if re.match(r'^\s{4}actions:\s*$', line): in_actions = True; in_vipc = False; continue
                      if in_vipc:
                          m = re.match(r'^\s{6}-\s*path:\s*"?([^"]+?)"?\s*$', line)
                          if m: cur_vipc = {'path': m.group(1).strip(), 'monitor': False, 'monitorOn': None}; prev['vipc'].append(cur_vipc); continue
                          m = re.match(r'^\s{8}monitorOn:\s*(\S+)', line)
                          if m and cur_vipc is not None: cur_vipc['monitorOn'] = [s.strip().lower() for s in m.group(1).split('+') if s.strip()]; continue
                          m = re.match(r'^\s{8}monitor:\s*(\S+)', line)
                          if m and cur_vipc is not None: cur_vipc['monitor'] = (m.group(1).strip().lower() == 'true'); continue
                      if in_actions:
                          m = re.match(r'^\s{6}([A-Za-z0-9_.\-]+):\s*"?([^"\s]+)"?\s*$', line)
                          if m: prev['actions'][m.group(1)] = m.group(2); continue
                      if re.match(r'^\s{0,3}\S', line): in_container = False; in_vipc = False; in_actions = False
                  m = re.match(r'^\s*installedVersion:\s*(\S+)', line)
                  if m: prev['installedVersion'] = m.group(1)
                  m = re.match(r'^\s*repo:\s*(\S+)', line)
                  if m and not prev['repo']: prev['repo'] = m.group(1)
                  m = re.match(r'^\s*ref:\s*(\S+)', line)
                  if m and prev['ref'] == 'main': prev['ref'] = m.group(1)
                  m = re.match(r'^\s{2}labviewVersion:\s*"?([^"\s]+)"?', line)
                  if m: prev['labviewVersion'] = m.group(1)
                  m = re.match(r'^\s{2}os:\s*\[([^\]]*)\]', line)
                  if m: prev['os'] = [x.strip() for x in m.group(1).split(',') if x.strip()]
                  m = re.match(r'^\s{4}maxParallel:\s*(\d+)', line)
                  if m: prev['maxParallel'] = int(m.group(1))

          # Monitored Dragon files (config.container.dragon): scanned separately from the
          # main state machine above to keep that loop untouched. container: -> dragon:
          def _scan_prev_dragon(text):
              out = []; in_c = False; in_d = False; cur = None
              for line in text.splitlines():
                  if re.match(r'^\s*container:\s*$', line):
                      in_c = True; in_d = False; cur = None; continue
                  if not in_c:
                      continue
                  if re.match(r'^\s{0,3}\S', line):     # left the container block
                      in_c = False; in_d = False; cur = None; continue
                  if re.match(r'^\s{4}dragon:\s*$', line):
                      in_d = True; cur = None; continue
                  if re.match(r'^\s{4}\S', line):       # another 4-space key ends the list
                      in_d = False; cur = None; continue
                  if in_d:
                      m = re.match(r'^\s{6}-\s*path:\s*"?([^"]+?)"?\s*$', line)
                      if m:
                          cur = {'path': m.group(1).strip(), 'monitor': False, 'monitorOn': None}; out.append(cur); continue
                      m = re.match(r'^\s{8}monitorOn:\s*(\S+)', line)
                      if m and cur is not None:
                          cur['monitorOn'] = [s.strip().lower() for s in m.group(1).split('+') if s.strip()]; continue
                      m = re.match(r'^\s{8}monitor:\s*(\S+)', line)
                      if m and cur is not None:
                          cur['monitor'] = (m.group(1).strip().lower() == 'true')
              return out
          prev['dragon'] = _scan_prev_dragon(mpath.read_text(encoding='utf-8')) if mpath.exists() else []

          # version / os / runners: explicit input wins; blank or "keep" preserves
          # whatever the manifest had (so a focused editor can change one thing).
          ver = ver_in or prev.get('labviewVersion') or '2026'
          os_list = (prev['os'] or ['windows', 'linux']) if oss in ('', 'keep') \
              else (['windows', 'linux'] if oss == 'both' else [oss])
          acts = [a.strip() for a in acts_in.split(',') if a.strip()] \
              or prev['activities'] or ['dashboard', 'masscompile', 'vi-analyzer', 'vidiff']
          # Capabilities the catalog marks `required` are installed in every
          # repository (VI Snapshots 2.0), so the manifest must list them even when
          # it was written before the capability existed -- otherwise the next
          # tooling update reads this file back and skips them again.
          try:
              _cat = json.loads(pathlib.Path('.github/labview-ci/catalog.json').read_text(encoding='utf-8'))
              for _cap in _cat.get('capabilities', []):
                  if _cap.get('required') and _cap.get('status') not in ('planned', 'experimental') \
                          and _cap.get('id') not in acts:
                      acts.append(_cap['id'])
          except Exception:
              pass
          now = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          max_parallel = int(runners) if runners.isdigit() and int(runners) > 0 else (prev.get('maxParallel') or 5)

          # Container: explicit input wins; blank keeps whatever the manifest had.
          container_use = container_use_in or prev['container_use'] or 'latest'
          # Worker platforms a dependency file can be monitored for. A file with
          # monitor:true and no monitorOn is monitored for ALL of them (back-compat
          # with configs written before per-container monitoring).
          ALL_MON_PLATFORMS = ['windows', 'linux']
          def _norm_on(v):
              if not v.get('monitor'):
                  return []
              on = v.get('monitorOn')
              if on is None:
                  return list(ALL_MON_PLATFORMS)
              return [p for p in ALL_MON_PLATFORMS if p in on]
          def _parse_vipc(s):
              out = []
              for entry in s.split(';'):
                  entry = entry.strip()
                  if not entry: continue
                  if '::' in entry:
                      path, mon = entry.rsplit('::', 1)
                      low = mon.strip().lower()
                      if low in ('1', 'true', 'yes', 'on'):
                          on = list(ALL_MON_PLATFORMS)
                      elif low in ('', '0', 'false', 'no', 'off', 'none', '-'):
                          on = []
                      else:
                          on = [p for p in low.split('+') if p in ALL_MON_PLATFORMS]
                      out.append({'path': path.strip(), 'monitor': bool(on), 'monitorOn': on})
                  else:
                      out.append({'path': entry, 'monitor': False, 'monitorOn': []})
              return out
          vipc = _parse_vipc(container_vipc_in) if container_vipc_in else prev['vipc']
          dragon = _parse_vipc(container_dragon_in) if container_dragon_in else prev['dragon']

          # Per-action container overrides: explicit input wins; blank keeps the
          # manifest's. Each entry is "<activity-id>::<tag>" (tag = latest, a pinned
          # build, "base" for the bare NI image, or any custom tag).
          def _parse_actions(s):
              out = {}
              for entry in s.split(';'):
                  entry = entry.strip()
                  if not entry or '::' not in entry: continue
                  k, v = entry.split('::', 1)
                  k = k.strip(); v = v.strip()
                  if k and v: out[k] = v
              return out
          container_actions = _parse_actions(container_actions_in) if container_actions_in else prev['actions']

          # Per-activity submission triggers: explicit input wins; blank keeps the
          # manifest's. Each entry is "<activity-id>::<sources>" where sources are
          # joined by + (push-default, pr-branch, pr-fork) or the literal "none".
          def _parse_triggers(s):
              out = {}
              for entry in s.split(';'):
                  entry = entry.strip()
                  if not entry or '::' not in entry: continue
                  k, v = entry.split('::', 1)
                  k = k.strip(); v = v.strip()
                  if k and v: out[k] = v
              return out
          triggers = _parse_triggers(action_triggers_in) if action_triggers_in else dict(prev['triggers'])
          # onDependencyChange is retired: dependency updates are explicit/opt-in and
          # never auto-rerun the pipeline. Drop any legacy flag so it is not re-emitted.
          triggers.pop('onDependencyChange', None)

          # VI Browser render matrix: explicit input wins; blank keeps the manifest's.
          # "classic::<oses>;positionAware::<oses>" (oses joined by +, or "none").
          def _parse_vibrowser(s):
              out = {}
              for entry in s.split(';'):
                  entry = entry.strip()
                  if not entry or '::' not in entry: continue
                  k, v = entry.split('::', 1)
                  k = k.strip(); v = v.strip()
                  if k and v: out[k] = v
              return out
          vi_browser = _parse_vibrowser(vi_browser_in) if vi_browser_in else prev['viBrowser']

          # Per-action platforms (config.actionOs): same id::oses;.. shape as the
          # VI Browser matrix. Explicit input wins; blank keeps the manifest's.
          action_os = _parse_vibrowser(action_os_in) if action_os_in else prev['actionOs']

          # Dependency policy: explicit input wins; "keep"/blank preserves.
          def _dep_bool(in_val, key):
              if in_val in ('', 'keep'):
                  return str(prev['dependencyPolicy'].get(key, '')).lower() == 'true'
              return in_val == 'true'
          require_installed = _dep_bool(require_deps_in, 'requireInstalled')
          auto_install = _dep_bool(auto_install_in, 'autoInstall')

          # VI Analyzer: which .viancfg test config runs on which code. Explicit
          # inputs win; blank keeps the manifest's. Parsed on its own (nested rules).
          def _parse_via_block(text):
              out = {'default': '', 'rules': []}
              lines = text.splitlines()
              i = 0
              while i < len(lines) and not re.match(r'^\s{2}viAnalyzer:\s*$', lines[i]):
                  i += 1
              i += 1
              cur = None; in_rules = False
              while i < len(lines):
                  line = lines[i]; i += 1
                  if re.match(r'^\s{0,3}\S', line):
                      break
                  m = re.match(r'^\s{4}default:\s*"?([^"\s]+)"?', line)
                  if m:
                      out['default'] = m.group(1); in_rules = False; continue
                  if re.match(r'^\s{4}rules:\s*$', line):
                      in_rules = True; continue
                  if in_rules:
                      m = re.match(r'^\s{6}-\s*config:\s*"?([^"]+?)"?\s*$', line)
                      if m:
                          cur = {'config': m.group(1).strip(), 'paths': []}; out['rules'].append(cur); continue
                      m = re.match(r'^\s{8}paths:\s*"?([^"]*?)"?\s*$', line)
                      if m and cur is not None:
                          cur['paths'] = [p.strip() for p in m.group(1).split('|') if p.strip()]; continue
              return out
          def _parse_via_rules(s):
              rules = []
              for entry in s.split(';'):
                  entry = entry.strip()
                  if not entry or '::' not in entry:
                      continue
                  cfg, paths = entry.split('::', 1)
                  cfg = cfg.strip()
                  pl = [p.strip() for p in paths.split('|') if p.strip()]
                  if cfg and pl:
                      rules.append({'config': cfg, 'paths': pl})
              return rules
          prev_via = _parse_via_block(mpath.read_text(encoding='utf-8')) if mpath.exists() else {'default': '', 'rules': []}
          if via_default_in:
              # A dedicated VI Analyzer editor sends the full state: the default is
              # authoritative and rules are taken as provided (empty = no rules).
              via_default = via_default_in
              via_rules = _parse_via_rules(via_rules_in)
          elif via_rules_in:
              via_default = prev_via.get('default') or 'builtin'
              via_rules = _parse_via_rules(via_rules_in)
          else:
              via_default = prev_via.get('default', '')
              via_rules = prev_via.get('rules', [])

          # Builds: which build specifications run, and on which OS. Input "all"
          # (or an all-selected list) = build everything (the default, no block
          # written); an explicit list restricts specs/OS; blank keeps the
          # manifest's block. Shape: <project>::<name>::<os+os|none>.
          def _parse_builds_block(text):
              lines = text.splitlines(); i = 0
              while i < len(lines) and not re.match(r'^\s{2}builds:\s*$', lines[i]):
                  i += 1
              if i >= len(lines):
                  return None
              i += 1; run_all = True; specs = []; in_specs = False; saw = False
              while i < len(lines):
                  line = lines[i]; i += 1
                  if re.match(r'^\s{0,1}\S', line):
                      break
                  m = re.match(r'^\s{4}runAll:\s*(true|false)', line)
                  if m:
                      run_all = (m.group(1) == 'true'); in_specs = False; saw = True; continue
                  if re.match(r'^\s{4}specs:\s*$', line):
                      in_specs = True; saw = True; continue
                  if in_specs:
                      m = re.match(r'^\s{6}-\s*"?([^"]+?)"?\s*$', line)
                      if m:
                          specs.append(m.group(1)); saw = True
              return {'runAll': run_all, 'specs': specs} if saw else None
          def _parse_builds_input(s):
              s = s.strip()
              if s == '':
                  return None
              if s.lower() == 'all':
                  return {'runAll': True, 'specs': []}
              specs = []
              for e in s.split(';'):
                  e = e.strip().replace('"', '')
                  if e and e.count('::') >= 2:
                      specs.append(e)
              return {'runAll': False, 'specs': specs}
          prev_builds = _parse_builds_block(mpath.read_text(encoding='utf-8')) if mpath.exists() else None
          _parsed_builds = _parse_builds_input(builds_in)
          builds_cfg = _parsed_builds if _parsed_builds is not None else prev_builds

          lines = [
              '# .github/labview-ci.yml - LabVIEW CI configuration',
              '# Updated by the Reconfigure workflow.',
              'schemaVersion: 1',
          ]
          if prev['installedVersion']:
              lines.append(f"installedVersion: {prev['installedVersion']}")
          lines.append(f"configuredAt: {now}")
          if prev['repo']:
              lines += ['source:', f"  repo: {prev['repo']}", f"  ref: {prev['ref']}"]
          lines += [
              'config:',
              f'  labviewVersion: "{ver}"',
              f'  os: [{", ".join(os_list)}]',
              '  concurrency:',
              f'    maxParallel: {max_parallel}',
          ]
          lines += ['  container:', f'    use: {container_use}']
          if vipc:
              lines.append('    vipc:')
              for v in vipc:
                  p = str(v['path']).replace('"', '')
                  on = _norm_on(v)
                  lines.append(f'      - path: "{p}"')
                  lines.append(f"        monitor: {'true' if on else 'false'}")
                  if on and set(on) != set(ALL_MON_PLATFORMS):
                      lines.append(f"        monitorOn: {'+'.join(on)}")
          if dragon:
              lines.append('    dragon:')
              for v in dragon:
                  p = str(v['path']).replace('"', '')
                  on = _norm_on(v)
                  lines.append(f'      - path: "{p}"')
                  lines.append(f"        monitor: {'true' if on else 'false'}")
                  if on and set(on) != set(ALL_MON_PLATFORMS):
                      lines.append(f"        monitorOn: {'+'.join(on)}")
          if container_actions:
              lines.append('    actions:')
              for _id in sorted(container_actions):
                  lines.append(f'      {_id}: {container_actions[_id]}')
          if vi_browser:
              lines.append('  viBrowser:')
              for _k in ('classic', 'positionAware'):
                  if _k in vi_browser:
                      lines.append(f'    {_k}: {vi_browser[_k]}')
          if via_default and (via_default != 'builtin' or via_rules):
              lines.append('  viAnalyzer:')
              lines.append(f'    default: {via_default}')
              if via_rules:
                  lines.append('    rules:')
                  for _r in via_rules:
                      _cfg = _r['config']
                      if _cfg == 'none':
                          lines.append('      - config: none')
                      else:
                          lines.append('      - config: "' + str(_cfg).replace('"', '') + '"')
                      _paths = '|'.join(str(p).replace('|', '').replace('"', '') for p in _r['paths'])
                      lines.append(f'        paths: "{_paths}"')
          # Builds: only written when specs are restricted (runAll is the default;
          # no block means the runners build every spec on every supported OS).
          if builds_cfg and not builds_cfg.get('runAll', True):
              lines.append('  builds:')
              lines.append('    runAll: false')
              if builds_cfg.get('specs'):
                  lines.append('    specs:')
                  for _e in builds_cfg['specs']:
                      lines.append('      - "' + str(_e).replace('"', '') + '"')
          if triggers:
              lines.append('  triggers:')
              for _id in sorted(triggers):
                  lines.append(f'    {_id}: {triggers[_id]}')
          if action_os:
              lines.append('  actionOs:')
              for _id in sorted(action_os):
                  lines.append(f'    {_id}: {action_os[_id]}')
          if require_installed or auto_install:
              lines.append('  dependencyPolicy:')
              lines.append(f"    requireInstalled: {'true' if require_installed else 'false'}")
              lines.append(f"    autoInstall: {'true' if auto_install else 'false'}")
          lines += ['activities:'] + [f'  - {a}' for a in acts] + ['']
          def _unit_tests_block_from_json(s):
              data = json.loads(s)
              tools = data.get('tools', data) if isinstance(data, dict) else {}
              if not isinstance(tools, dict):
                  raise ValueError('unit_tests must be a JSON object')
              def _pct(value, default):
                  try:
                      return max(0, min(100, int(float(str(value).strip()))))
                  except Exception:
                      return default
              raw_thresholds = data.get('thresholds', {}) if isinstance(data, dict) else {}
              raw_passed = raw_thresholds.get('passedPercent', {}) if isinstance(raw_thresholds, dict) else {}
              passed = {
                  'greenAtLeast': _pct(raw_passed.get('greenAtLeast'), 100),
                  'yellowAtLeast': _pct(raw_passed.get('yellowAtLeast'), 80),
                  'redBelow': _pct(raw_passed.get('redBelow'), 80),
              }
              passed['greenAtLeast'] = max(passed['greenAtLeast'], passed['yellowAtLeast'])
              passed['redBelow'] = min(passed['redBelow'], passed['yellowAtLeast'])
              ordered = [k for k in ('caraya', 'lunit', 'vi-tester', 'utf') if k in tools]
              ordered += sorted(k for k in tools if k not in ordered)
              out = [
                  'unitTests:',
                  '  thresholds:',
                  '    passedPercent:',
                  f"      greenAtLeast: {passed['greenAtLeast']}",
                  f"      yellowAtLeast: {passed['yellowAtLeast']}",
                  f"      redBelow: {passed['redBelow']}",
                  '  tools:',
              ]
              for key in ordered:
                  if not re.match(r'^[A-Za-z0-9_.-]+$', key):
                      raise ValueError(f'invalid unit-test tool id: {key!r}')
                  cfg = tools.get(key) or {}
                  enabled = bool(cfg.get('enabled'))
                  raw_locs = cfg.get('locations') or []
                  if not isinstance(raw_locs, list):
                      raise ValueError(f'locations for {key} must be a list')
                  locs = [str(x).strip() for x in raw_locs if str(x).strip()]
                  out.append(f'    {key}:')
                  out.append(f"      enabled: {'true' if enabled else 'false'}")
                  if locs:
                      out.append('      locations:')
                      for loc in locs:
                          out.append('        - "' + loc.replace('"', '\\"') + '"')
                  else:
                      out.append('      locations: []')
              return out
          unit_tests_block = _unit_tests_block_from_json(unit_tests_in) if unit_tests_in else prev.get('unitTests_block')
          if unit_tests_block:
              lines += unit_tests_block + ['']
          mpath.parent.mkdir(parents=True, exist_ok=True)
          mpath.write_text('\n'.join(lines), encoding='utf-8')
          print('Wrote', mpath)

          # Hand the resolved LabVIEW version to the VIPC-regen step (the input may
          # have been blank = keep current).
          if os.environ.get('GITHUB_ENV'):
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as _f:
                  _f.write(f'RESOLVED_LV={ver}\n')

          # Antidoc dependencies are now owned by committed
          # .github/labview/antidoc/antidoc.vipc (VIPC-first). Keep this input
          # non-destructive here for backward compatibility with Configure UI.
          if antidoc_in not in ('', 'keep'):
              print('Antidoc toggle requested:', antidoc_in)
              print('No manifest regeneration is performed; committed antidoc.vipc remains authoritative.')
          else:
              print('Antidoc: keep current')
          PY

      - name: Validate committed container VIPCs (best effort)
        continue-on-error: true
        run: |
          for VIPC in .github/labview/vipm/ci-tooling.vipc .github/labview/antidoc/antidoc.vipc; do
            if [ -f "$VIPC" ]; then
              python3 -c 'import sys, zipfile, xml.etree.ElementTree as ET; p = sys.argv[1]; z = zipfile.ZipFile(p); assert "config.xml" in z.namelist(), p + " is missing config.xml"; ET.fromstring(z.read("config.xml")); print("Validated committed VIPC:", p)' "$VIPC"
            else
              echo "No committed VIPC found at $VIPC; skipping validation."
            fi
          done

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="labview-ci/reconfigure-${{ github.run_id }}"
          git checkout -b "$BRANCH"

          git add .github/labview-ci.yml
          [ -f .github/labview/vipm/ci-tooling.packages.json ] && git add .github/labview/vipm/ci-tooling.packages.json || true
          [ -f .github/labview/vipm/ci-tooling.vipc ] && git add .github/labview/vipm/ci-tooling.vipc || true

          if git diff --cached --quiet; then
            echo "No changes — current settings already match. No PR opened."
            exit 0
          fi

          git commit -m "ci: reconfigure LabVIEW CI settings"
          git push -u origin "$BRANCH"

          gh pr create \
            --title "Reconfigure LabVIEW CI" \
            --base "${{ github.ref_name }}" \
            --head "$BRANCH" \
            --body "$(cat <<'BODY'
          Automated settings change via the **Reconfigure** workflow.

          | Setting | Value |
          |---|---|
          | LabVIEW version | ${{ inputs.labview_version }} |
          | Operating systems | ${{ inputs.operating_systems }} |
          | Antidoc | ${{ inputs.antidoc }} |
          | Max concurrent runners | ${{ inputs.concurrent_runners }} |
          | Activities | ${{ inputs.activities }} |
          | Container | ${{ inputs.container_use }} |
          | Per-action containers | ${{ inputs.container_actions }} |
          | Activity triggers | ${{ inputs.action_triggers }} |
          | VI Browser renders | ${{ inputs.vi_browser }} |
          | VI Analyzer default | ${{ inputs.via_default }} |
          | VI Analyzer rules | ${{ inputs.via_rules }} |
          | Builds | ${{ inputs.builds }} |
          | Unit tests | ${{ inputs.unit_tests }} |

          Review and merge to apply. Container-dependency and LabVIEW-version changes
          take effect on the next image build; OS/runner settings apply where the
          workflows are wired to read `labview-ci.yml`.
          BODY
          )"
