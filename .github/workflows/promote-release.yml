# Owner-only: mark a published version as the STABLE release (or roll it back).
#
# This is the go-live control behind the "Mark as stable release" button on the
# What's New page. It never builds anything: it edits the catalog so
# `stableVersion` points at an already-published, immutable `v<version>` release
# and flags that release `"stable": true`, then pushes to the default branch.
# release.yml then force-moves the rolling `stable` tag to the blessed commit.
#
# Only someone with `Actions: write` on THIS (source) repo can dispatch it, so
# the promote button is genuinely owner-only. The catalog edit runs here with the
# built-in GITHUB_TOKEN (a catalog change, not a workflow-file change), so no PAT
# is needed for the commit itself.
name: Promote release
run-name: >-
  ${{ github.event.inputs.unpromote == 'true' && 'Un-mark' || 'Mark' }}
  v${{ github.event.inputs.version }} ${{ github.event.inputs.unpromote == 'true' && 'off' || 'as' }}
  ${{ github.event.inputs.tier || 'stable' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published version to mark (e.g. 4.9.7)'
        type: string
        required: true
      tier:
        description: 'Which channel to mark it in'
        type: choice
        options:
          - stable
          - beta
        default: stable
      unpromote:
        description: 'Roll the chosen channel back OFF this version instead of marking it'
        type: boolean
        default: false

concurrency:
  group: promote-release
  cancel-in-progress: false

permissions:
  contents: write   # commit the catalog edit to the default branch (built-in token; no PAT)
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify the version is published and tagged
        env:
          VER: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          VER="${VER#v}"
          case "$VER" in
            [0-9]*.[0-9]*.[0-9]*) : ;;
            *) echo "::error::'$VER' is not MAJOR.MINOR.PATCH"; exit 1 ;;
          esac
          if ! git rev-parse -q --verify "refs/tags/v${VER}^{}" >/dev/null; then
            echo "::error::v${VER} is not a published release tag; promote only a released version."
            exit 1
          fi
          echo "v${VER} tag verified."

      - name: Gate - catalog/source sync
        run: python3 .github/labview/validate-catalog-source-sync.py

      - name: Apply the promotion to the catalog
        env:
          VER: ${{ github.event.inputs.version }}
          TIER: ${{ github.event.inputs.tier }}
          UNPROMOTE: ${{ github.event.inputs.unpromote }}
        run: |
          set -euo pipefail
          ARGS=(--version "${VER#v}" --tier "${TIER:-stable}")
          if [ "${UNPROMOTE}" = "true" ]; then ARGS+=(--unpromote); fi
          python3 .github/labview/promote-release.py "${ARGS[@]}"
          python3 -c "import json;json.load(open('.github/labview-ci/catalog.json'))"  # validity re-check

      - name: Commit the promotion or open a review PR
        id: catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CAT=.github/labview-ci/catalog.json
          if git diff --quiet -- "$CAT"; then
            echo "::warning::No catalog change produced; nothing to promote."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NEWVER=$(python3 -c "import json;print(json.load(open('$CAT'))['version'])")
          STABLE=$(python3 -c "import json;print(json.load(open('$CAT')).get('stableVersion',''))")
          git add "$CAT"
          git commit -m "Prepare release channel: stable=${STABLE:-none} (catalog ${NEWVER})"
          python3 .github/labview/release-catalog-pr.py push --version "$NEWVER" --kind promotion

      # Publish INSIDE this run. This step used to be absent: the job pushed the
      # catalog with the built-in GITHUB_TOKEN and relied on release.yml noticing,
      # but GITHUB_TOKEN pushes do not trigger workflows. So every promotion bumped
      # the catalog to a version that was never tagged and never released --
      # 4.10.2, 4.10.3 and 4.11.11 are all phantoms created exactly this way, and
      # the rolling tag never moved either (the `beta` tag sat on v4.11.8 for
      # three weeks while betaVersion said 4.11.10).
      - name: Tag, move the channel tag, publish the release
        if: steps.catalog.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/labview/publish-release.sh

      - name: Summary
        if: success() && steps.catalog.outputs.published == 'true'
        run: |
          CAT=.github/labview-ci/catalog.json
          STABLE=$(python3 -c "import json;print(json.load(open('$CAT')).get('stableVersion',''))" 2>/dev/null || echo "")
          BETA=$(python3 -c "import json;print(json.load(open('$CAT')).get('betaVersion',''))" 2>/dev/null || echo "")
          {
            echo "## Release channel updated"
            echo ""
            echo "- Stable version is now: \`${STABLE:-none}\`"
            echo "- Beta version is now: \`${BETA:-none}\`"
            echo "- The rolling tag was moved in this run."
          } >> "$GITHUB_STEP_SUMMARY"
