name: VIDiff Deploy Checks

on:
  pull_request:
    paths:
      - '.github/workflows/vidiff-deploy.yml'
      - '.github/workflows/vidiff-deploy-checks.yml'
      - '.github/labview/extract-vidiff-artifact.py'
      - '.github/labview/validate-vidiff-deploy-metadata.py'
      - '.github/labview/test-vidiff-deploy.py'
      - '.github/labview/test-vidiff-deploy.mjs'
      - '.github/labview/test-vidiff-distribution.py'
      - '.github/labview-ci/catalog.json'
      - '.github/labview-ci/install.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/vidiff-deploy.yml'
      - '.github/workflows/vidiff-deploy-checks.yml'
      - '.github/labview/extract-vidiff-artifact.py'
      - '.github/labview/validate-vidiff-deploy-metadata.py'
      - '.github/labview/test-vidiff-deploy.py'
      - '.github/labview/test-vidiff-deploy.mjs'
      - '.github/labview/test-vidiff-distribution.py'
      - '.github/labview-ci/catalog.json'
      - '.github/labview-ci/install.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-security-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate workflow metadata guardrails and provenance checks
        run: |
          python .github/labview/test-vidiff-deploy.py
          python .github/labview/test-vidiff-distribution.py
          node --test .github/labview/test-vidiff-deploy.mjs
      - name: Validate mocked suite under github-script v9 runtime
        uses: actions/github-script@v9
        with:
          script: |
            const { spawnSync } = require('node:child_process');
            const result = spawnSync(process.execPath, ['--test', '.github/labview/test-vidiff-deploy.mjs'], {
              stdio: 'inherit',
            });
            if (result.error) throw result.error;
            if (result.status !== 0) {
              throw new Error(`node --test exited with status ${result.status}`);
            }
