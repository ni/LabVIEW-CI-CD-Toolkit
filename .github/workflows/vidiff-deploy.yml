name: VIDiff Deploy — Pages + PR Comment
run-name: Deploy VIDiff pages and comment - ${{ github.event_name == 'workflow_dispatch' && 'manual run' || github.sha }}

on:
  workflow_run:
    workflows:
      - "VIDiff Report — Windows Container"
      - "VIDiff Report — Linux Container"
    types: [completed]

env:
  PAGES_URL: ${{ vars.PAGES_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}

permissions:
  actions: read
  contents: write
  pull-requests: write
  pages: write
  statuses: write

# Serialize the gh-pages push with the other report deployers. The Windows and
# Linux VIDiff reports complete near-simultaneously, and each completion fires its
# own vidiff-deploy run; without a shared group the two push gh-pages at the same
# instant and the loser bounces with "! [rejected] (fetch first)" (its report never
# deploys). Sharing report-pages-deploy queues them — and queues vidiff alongside
# the mass-compile / VI Analyzer / unit-test / Antidoc deploys — instead of racing.
# cancel-in-progress:false so a queued run still publishes rather than being dropped.
concurrency:
  group: report-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Run whether the VIDiff workflow passed or failed — we still want the report
    if: always()

    steps:
      # Required so the local ./.github/actions/publish-gh-pages composite action
      # is on disk. Without a checkout the deploy step fails with "Can't find
      # 'action.yml' … under '.github/actions/publish-gh-pages'".
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download VIDiff artifact
        uses: actions/github-script@v9
        id: artifact
        with:
          script: |
            const workflowRun = context.payload.workflow_run;
            if (!workflowRun || typeof workflowRun.id !== 'number') {
              throw new Error('workflow_run payload is missing or invalid.');
            }
            const run_id = workflowRun.id;
            const platformByWorkflow = {
              'VIDiff Report — Windows Container': 'windows',
              'VIDiff Report — Linux Container': 'linux',
            };
            const expectedPathByPlatform = {
              windows: '.github/workflows/vidiff-windows-container.yml',
              linux: '.github/workflows/vidiff-linux-container.yml',
            };
            const platform = platformByWorkflow[workflowRun.name];
            if (!platform) {
              throw new Error(`Untrusted workflow_run.name: ${String(workflowRun.name)}`);
            }
            const expectedWorkflowPath = expectedPathByPlatform[platform];
            const workflowPath = String(workflowRun.path || '');
            if (workflowPath !== expectedWorkflowPath) {
              throw new Error(`Unexpected workflow_run.path: ${workflowPath}`);
            }
            const expectedRepo = `${context.repo.owner}/${context.repo.repo}`;
            const sourceRepo = workflowRun.repository && workflowRun.repository.full_name;
            if (sourceRepo !== expectedRepo) {
              throw new Error(`Unexpected workflow_run.repository.full_name: ${String(sourceRepo)}`);
            }
            const sourceEvent = String(workflowRun.event || '');
            if (!['push', 'pull_request', 'workflow_dispatch'].includes(sourceEvent)) {
              throw new Error(`Unsupported workflow_run.event: ${sourceEvent}`);
            }
            const runHeadSha = String(workflowRun.head_sha || '').toLowerCase();
            if (!/^[0-9a-f]{40}$/.test(runHeadSha)) {
              throw new Error(`Invalid workflow_run.head_sha: ${runHeadSha}`);
            }
            const prs = Array.isArray(workflowRun.pull_requests) ? workflowRun.pull_requests : [];
            let prNumbers = [...new Set(prs.map(pr => Number(pr && pr.number)).filter(Number.isInteger))];
            if (prNumbers.some(number => number <= 0)) {
              throw new Error('workflow_run.pull_requests contains a non-positive PR number.');
            }
            if (sourceEvent === 'pull_request' && prNumbers.length === 0) {
              const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: runHeadSha,
              });
              const trustedAssociatedNumbers = [...new Set((associated.data || [])
                .filter(pr =>
                  pr &&
                  Number.isInteger(pr.number) &&
                  pr.number > 0 &&
                  pr.base &&
                  pr.base.repo &&
                  pr.base.repo.full_name === expectedRepo &&
                  String(pr.head && pr.head.sha || '').toLowerCase() === runHeadSha
                )
                .map(pr => pr.number))];
              prNumbers = trustedAssociatedNumbers;
            }
            if (prNumbers.length > 1) {
              throw new Error(`pull_request lineage is ambiguous: ${prNumbers.join(',')}`);
            }
            if (sourceEvent === 'pull_request' && prNumbers.length !== 1) {
              throw new Error('pull_request workflow_run is missing a trusted PR association.');
            }
            const pr_number = prNumbers.length === 1 ? String(prNumbers[0]) : '';
            let publishPages = true;
            let publishReason = 'trusted';
            const markUntrusted = reason => {
              if (publishPages) {
                publishPages = false;
                publishReason = reason;
              }
            };
            if (pr_number) {
              const pull = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: Number(pr_number),
              });
              const baseRepo = pull.data && pull.data.base && pull.data.base.repo && pull.data.base.repo.full_name;
              if (baseRepo !== expectedRepo) {
                throw new Error(`Unexpected pull base repository for PR #${pr_number}: ${String(baseRepo)}`);
              }
              const headRepo = pull.data && pull.data.head && pull.data.head.repo && pull.data.head.repo.full_name;
              const headSha = String(pull.data && pull.data.head && pull.data.head.sha || '').toLowerCase();
              if (headSha !== runHeadSha) {
                throw new Error(`PR #${pr_number} head SHA mismatch for workflow_run lineage.`);
              }
              if (!headRepo) {
                markUntrusted('untrusted-missing-pr-head-repo');
              } else if (headRepo !== expectedRepo) {
                markUntrusted('untrusted-fork-pr');
              }
            }
            const runConclusion = String(workflowRun.conclusion || '').toLowerCase();
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              run_id,
            });
            const pattern = new RegExp(`^vidiff-${platform}-([0-9a-f]{40})$`);
            const candidates = (artifacts.data.artifacts || [])
              .filter(artifact => artifact && typeof artifact.name === 'string')
              .map(artifact => {
                const match = artifact.name.match(pattern);
                return match ? { artifact, headSha: match[1] } : null;
              })
              .filter(Boolean);
            let trustedHeadSha = '';
            let art = null;
            if (sourceEvent === 'workflow_dispatch') {
              if (candidates.length === 0) {
                core.warning(`No ${platform} VIDiff artifact found for workflow_dispatch run.`);
                core.setOutput('found', 'false');
                return null;
              }
              if (candidates.length > 1) {
                throw new Error(
                  `workflow_dispatch run produced multiple ${platform} artifacts; cannot infer trusted head SHA safely.`
                );
              }
              ({ artifact: art, headSha: trustedHeadSha } = candidates[0]);
            } else {
              const expectedArtifactName = `vidiff-${platform}-${runHeadSha}`;
              const exact = candidates.find(entry => entry.artifact.name === expectedArtifactName);
              if (exact) {
                ({ artifact: art, headSha: trustedHeadSha } = exact);
              }
            }
            if (!art) {
              core.warning('No VIDiff artifact found — skipping deploy.');
              core.setOutput('found', 'false');
              return null;
            }
            if (typeof art.id !== 'number' || art.id <= 0) {
              throw new Error(`Invalid artifact id for ${art.name}`);
            }
            if (['workflow_dispatch', 'push'].includes(sourceEvent) && publishPages) {
              const producerHeadRepo = workflowRun.head_repository && workflowRun.head_repository.full_name;
              if (producerHeadRepo !== expectedRepo) {
                markUntrusted(sourceEvent === 'push' ? 'untrusted-push-producer' : 'untrusted-workflow-dispatch-producer');
              }
              const repo = await github.rest.repos.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              const defaultBranch = String(repo.data && repo.data.default_branch || '');
              if (!defaultBranch) {
                throw new Error('Missing default branch for workflow_dispatch trust check.');
              }
              const isDefaultReachable = async sha => {
                try {
                  const cmp = await github.rest.repos.compareCommitsWithBasehead({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    basehead: `${sha}...${defaultBranch}`,
                  });
                  const status = String(cmp.data && cmp.data.status || '');
                  return ['ahead', 'identical'].includes(status);
                } catch {
                  return false;
                }
              };
              const producerHeadReachable = await isDefaultReachable(runHeadSha);
              if (!producerHeadReachable) {
                markUntrusted(sourceEvent === 'push' ? 'untrusted-push-producer' : 'untrusted-workflow-dispatch-producer');
              }
              if (sourceEvent === 'workflow_dispatch') {
                const targetHeadReachable = await isDefaultReachable(trustedHeadSha);
                if (!targetHeadReachable) {
                  markUntrusted('untrusted-workflow-dispatch-target');
                }
              }
            }
            const dl = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              artifact_id: art.id,
              archive_format: 'zip',
            });
            const fs = require('fs');
            fs.writeFileSync('/tmp/vidiff-artifact.zip', Buffer.from(dl.data));
            const runUrl = String(workflowRun.html_url || `https://github.com/${expectedRepo}/actions/runs/${run_id}`);
            const artifactUrl = `${runUrl}/artifacts/${art.id}`;
            core.setOutput('found', 'true');
            core.setOutput('platform', platform);
            core.setOutput('head_sha', trustedHeadSha);
            core.setOutput('pr_number', pr_number);
            core.setOutput('run_conclusion', runConclusion);
            core.setOutput('segment', pr_number ? `pr-${pr_number}` : `push-${trustedHeadSha}`);
            core.setOutput('artifact_name', art.name);
            core.setOutput('publish_pages', publishPages ? 'true' : 'false');
            core.setOutput('publish_reason', publishReason);
            core.setOutput('run_url', runUrl);
            core.setOutput('artifact_url', artifactUrl);
            return art.name;

      - name: Extract artifact
        if: steps.artifact.outputs.found == 'true'
        run: |
          python3 -I -S .github/labview/extract-vidiff-artifact.py /tmp/vidiff-artifact.zip /tmp/vidiff-report

      - name: Validate artifact metadata provenance
        if: steps.artifact.outputs.found == 'true'
        id: meta
        env:
          TRUSTED_ARTIFACT_NAME: ${{ steps.artifact.outputs.artifact_name }}
          TRUSTED_HEAD_SHA: ${{ steps.artifact.outputs.head_sha }}
          TRUSTED_PLATFORM: ${{ steps.artifact.outputs.platform }}
          TRUSTED_PR_NUMBER: ${{ steps.artifact.outputs.pr_number }}
          TRUSTED_RUN_CONCLUSION: ${{ steps.artifact.outputs.run_conclusion }}
        run: |
          python3 -I -S .github/labview/validate-vidiff-deploy-metadata.py /tmp/vidiff-report/vidiff-meta.json

      # A targeted (single-VI) VIDiff run produces a changes.json listing only the
      # VIs it diffed. The Pages deploy uses keep_files, so that file would REPLACE
      # the revision's full index and drop other VIs' reports from the VI Browser.
      # Merge the new entries into the already-deployed index (new entries win) so a
      # single-VI run is additive and never regresses a fuller report.
      - name: Merge with existing report index (keep prior diff entries)
        if: >
          steps.artifact.outputs.found == 'true' &&
          steps.artifact.outputs.publish_pages == 'true'
        env:
          PLATFORM: ${{ steps.artifact.outputs.platform }}
          SEGMENT: ${{ steps.artifact.outputs.segment }}
        run: |
          NEWCH=/tmp/vidiff-report/vidiff/changes.json
          if [ ! -f "$NEWCH" ]; then echo "no changes.json in artifact; nothing to merge"; exit 0; fi
          EXIST_URL="${PAGES_URL}/vidiff/${SEGMENT}/${PLATFORM}/vidiff/changes.json"
          curl -fsSL "$EXIST_URL" -o /tmp/existing-changes.json 2>/dev/null || echo '{}' > /tmp/existing-changes.json
          python3 - "$NEWCH" /tmp/existing-changes.json <<'PY'
          import json, sys
          new_path, old_path = sys.argv[1], sys.argv[2]
          def load(p):
              try:
                  with open(p) as fh:
                      d = json.load(fh)
                      return d if isinstance(d, dict) else {}
              except Exception:
                  return {}
          new, old = load(new_path), load(old_path)
          def files(d):
              f = d.get('files')
              return f if isinstance(f, list) else []
          merged = {}
          for e in files(old) + files(new):   # new entries overwrite old for the same file
              if isinstance(e, dict) and e.get('file'):
                  merged[e['file']] = e
          new['files'] = list(merged.values())
          with open(new_path, 'w') as fh:
              json.dump(new, fh, indent=2)
          print('merged changes.json files:', len(new['files']))
          PY

      - name: Deploy VIDiff report to GitHub Pages
        if: >
          steps.artifact.outputs.found == 'true' &&
          steps.artifact.outputs.publish_pages == 'true'
        uses: ./.github/actions/publish-gh-pages
        with:
          publish_dir: /tmp/vidiff-report
          # push-SHORT_SHA/windows or pr-NUMBER/linux
          destination_dir: vidiff/${{ steps.artifact.outputs.segment }}/${{ steps.artifact.outputs.platform }}

      - name: Build report URL
        if: steps.artifact.outputs.found == 'true'
        id: url
        env:
          HEAD_SHA: ${{ steps.artifact.outputs.head_sha }}
          PLATFORM: ${{ steps.artifact.outputs.platform }}
          PR_NUMBER: ${{ steps.artifact.outputs.pr_number }}
          SEGMENT: ${{ steps.artifact.outputs.segment }}
          PUBLISH_PAGES: ${{ steps.artifact.outputs.publish_pages }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact_url }}
          RUN_URL: ${{ steps.artifact.outputs.run_url }}
        run: |
          if [ "$PUBLISH_PAGES" = "true" ] && [ -n "$PR_NUMBER" ]; then
            # PR head snapshots aren't published to the VI Browser, so link the
            # standalone diff report table for PRs.
            echo "url=${PAGES_URL}/vidiff/${SEGMENT}/${PLATFORM}/vidiff/index.html" >> "$GITHUB_OUTPUT"
          elif [ "$PUBLISH_PAGES" = "true" ]; then
            # For pushes (what the dashboard shows), open the unified VI Browser
            # filtered to this commit's changed VIs; each links to its diff report.
            echo "url=${PAGES_URL}/vi-snapshots/index.html?sha=${HEAD_SHA}&changed=1" >> "$GITHUB_OUTPUT"
          elif [ -n "$ARTIFACT_URL" ]; then
            echo "url=${ARTIFACT_URL}" >> "$GITHUB_OUTPUT"
          else
            echo "url=${RUN_URL}" >> "$GITHUB_OUTPUT"
          fi

      - name: Post commit status
        if: steps.artifact.outputs.found == 'true'
        uses: actions/github-script@v9
        env:
          HEAD_SHA: ${{ steps.artifact.outputs.head_sha }}
          OUTCOME: ${{ steps.meta.outputs.outcome }}
          PLATFORM: ${{ steps.artifact.outputs.platform }}
          REPORT_URL: ${{ steps.url.outputs.url }}
        with:
          script: |
            const headSha = String(process.env.HEAD_SHA || '').toLowerCase();
            if (!/^[0-9a-f]{40}$/.test(headSha)) {
              throw new Error(`Invalid HEAD_SHA: ${headSha}`);
            }
            const platform = String(process.env.PLATFORM || '');
            if (!['windows', 'linux'].includes(platform)) {
              throw new Error(`Invalid PLATFORM: ${platform}`);
            }
            const outcome = String(process.env.OUTCOME || '');
            if (!['success', 'failure'].includes(outcome)) {
              throw new Error(`Invalid OUTCOME: ${outcome}`);
            }
            const reportUrl = String(process.env.REPORT_URL || '');
            const parsed = new URL(reportUrl);
            if (parsed.protocol !== 'https:') {
              throw new Error(`Invalid REPORT_URL protocol: ${parsed.protocol}`);
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: headSha,
              state: outcome,
              target_url: reportUrl,
              description: `VIDiff (${platform}) ${outcome}`,
              context: `CI / VIDiff (${platform})`,
            });

      # ── Post PR comment with diff table ────────────────────────────────────
      - name: Post PR comment
        if: >
          steps.artifact.outputs.found == 'true' &&
          steps.artifact.outputs.pr_number != ''
        uses: actions/github-script@v9
        env:
          PLATFORM: ${{ steps.artifact.outputs.platform }}
          OUTCOME: ${{ steps.meta.outputs.outcome }}
          PR_NUMBER: ${{ steps.artifact.outputs.pr_number }}
          REPORT_URL: ${{ steps.url.outputs.url }}
          RUN_URL: ${{ steps.artifact.outputs.run_url }}
          PUBLISH_PAGES: ${{ steps.artifact.outputs.publish_pages }}
          PUBLISH_REASON: ${{ steps.artifact.outputs.publish_reason }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              throw new Error(`Invalid PR_NUMBER: ${String(process.env.PR_NUMBER || '')}`);
            }
            const reportUrl = String(process.env.REPORT_URL || '');
            const reportUri = new URL(reportUrl);
            if (reportUri.protocol !== 'https:') {
              throw new Error(`Invalid REPORT_URL protocol: ${reportUri.protocol}`);
            }
            const platform = String(process.env.PLATFORM || '');
            if (!['windows', 'linux'].includes(platform)) {
              throw new Error(`Invalid PLATFORM: ${platform}`);
            }
            const outcome = String(process.env.OUTCOME || '');
            if (!['success', 'failure'].includes(outcome)) {
              throw new Error(`Invalid OUTCOME: ${outcome}`);
            }
            const status    = outcome === 'success' ? '✅ Passed' : '❌ Failed';
            const runUrl = String(process.env.RUN_URL || '');
            const publishPages = String(process.env.PUBLISH_PAGES || '') === 'true';
            const publishReason = String(process.env.PUBLISH_REASON || '');

            const body = [
              `## VIDiff Report (${platform})`,
              '',
              `| Status | Report |`,
              `|--------|--------|`,
              `| ${status} | [View diff report](${reportUrl}) |`,
              ...(runUrl ? [`| Workflow run | [Open run logs](${runUrl}) |`] : []),
              ...(!publishPages ? ['', `Pages publication skipped: ${publishReason}.`] : []),
              '',
              `_Generated by the VIDiff workflow on ${new Date().toUTCString()}_`,
            ].join('\n');

            // Find and update existing comment, or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.startsWith(`## VIDiff Report (${platform})`)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
