name: Linux LVPM Checks

on:
  pull_request:
    paths:
      - '.github/labview/lvpm/**'
      - '.github/labview/vipm/ci-tooling.vipc'
      - '.github/labview/experimental.vipc'
      - '.github/labview/antidoc/antidoc.vipc'
      - '.github/labview/antidoc/antidoc.packages.json'
      - '.github/labview/test-lvpm*'
      - 'example/Dependencies.vipc'
      - 'example/Example.dragon'
      - '.github/labview-ci/catalog.json'
      - '.github/labview-ci/install.py'
      - '.github/docker/labview-ci-lvpm.Dockerfile'
      - '.github/workflows/build-labview-lvpm-image.yml'
      - '.github/workflows/*linux*'
      - '.github/workflows/vi-snapshots-json.yml'
      - '.github/workflows/reconfigure.yml'
      - '.github/workflows/lvpm-checks.yml'
      - '.github/pages/dependencies.html'
      - '.github/pages/configure.html'
      - '.github/pages/documentation.html'
      - 'actions/dashboard/**'
  push:
    branches: [main]
    paths:
      - '.github/labview/lvpm/**'
      - '.github/labview/vipm/ci-tooling.vipc'
      - '.github/labview/experimental.vipc'
      - '.github/labview/antidoc/antidoc.vipc'
      - '.github/labview/antidoc/antidoc.packages.json'
      - '.github/labview/test-lvpm*'
      - 'example/Dependencies.vipc'
      - 'example/Example.dragon'
      - '.github/labview-ci/catalog.json'
      - '.github/labview-ci/install.py'
      - '.github/docker/labview-ci-lvpm.Dockerfile'
      - '.github/workflows/build-labview-lvpm-image.yml'
      - '.github/workflows/*linux*'
      - '.github/workflows/vi-snapshots-json.yml'
      - '.github/workflows/reconfigure.yml'
      - '.github/workflows/lvpm-checks.yml'
      - '.github/pages/dependencies.html'
      - '.github/pages/configure.html'
      - '.github/pages/documentation.html'
      - 'actions/dashboard/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install test prerequisites
        run: python -m pip install PyYAML==6.0.3
      - name: Check adapter, provenance, and configuration contracts
        run: |
          python .github/labview/test-lvpm.py
          python .github/labview/test-lvpm-worker.py
          python .github/labview/test-lvpm-ux.py
          python .github/labview/test-lvpm-distribution.py
          node .github/labview/test-lvpm-ux.mjs
          python .github/labview/test-unit-tests.py
          python .github/labview/test-snapshots.py
          node .github/labview/test-snapshots.mjs
      - name: Check mirrored dashboard assets
        run: |
          cmp .github/pages/dependencies.html actions/dashboard/dependencies.html
          cmp .github/pages/configure.html actions/dashboard/configure.html
          cmp .github/pages/documentation.html actions/dashboard/documentation.html
      - name: Validate catalog/source sync
        run: python .github/labview/validate-catalog-source-sync.py
