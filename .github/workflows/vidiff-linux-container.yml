name: VIDiff Report — Linux Container
run-name: VIDiff Linux container - ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.head_sha || github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
    paths:
      - '**.vi'
      - '**.ctl'
      - '!.github/**'
  push:
    branches: [main]
    paths:
      - '**.vi'
      - '**.ctl'
      - '!.github/**'
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'Base commit SHA'
        required: false
        default: ''
      head_sha:
        description: 'Head commit SHA'
        required: false
        default: ''
      files:
        description: 'Optional comma/newline-separated VI/CTL paths to diff (default: all changed in the range)'
        required: false
        default: ''

env:
  LABVIEW_CONTAINER_IMAGE: ''

permissions:
  contents: read
  statuses: write
  packages: read
  actions: write  # wait-for-worker-image.sh reads worker-image build runs and starts the first build on a fresh fork

jobs:
  vidiff-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Determine SHAs
        id: shas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          expand() {
            local s="$1"
            [ -z "$s" ] && echo "" && return
            gh api "repos/${{ github.repository }}/commits/$s" --jq '.sha' 2>/dev/null || echo "$s"
          }
          if [ -n "${{ github.event.inputs.head_sha }}" ]; then
            HEAD=$(expand "${{ github.event.inputs.head_sha }}")
            BASE=$(expand "${{ github.event.inputs.base_sha }}")
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            HEAD="${{ github.event.pull_request.head.sha }}"
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            HEAD="${{ github.sha }}"
            BASE="${{ github.event.before }}"
          fi
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "pr_number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

      - name: Post pending status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ steps.shas.outputs.head }}" \
            -d "{\"state\":\"pending\",\"target_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"description\":\"VIDiff in progress\",\"context\":\"CI / VIDiff (linux)\"}"

      - name: Checkout head commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.shas.outputs.head }}
          fetch-depth: 0
          path: head

      - name: Checkout base commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.shas.outputs.base }}
          path: base

      - name: Restore CI scripts from main
        if: github.event_name == 'workflow_dispatch'
        working-directory: head
        run: |
          git fetch --no-tags origin "${{ github.event.repository.default_branch }}"
          git checkout FETCH_HEAD -- .github/labview .github/workflows .github/actions/publish-gh-pages

      - name: Resolve Linux container image name
        working-directory: head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_OVERRIDE: ${{ vars.LABVIEW_IMAGE_NAME }}
          ACTION_ID: vidiff
        run: |
          python3 -m pip install --quiet PyYAML==6.0.3 tomli==2.4.0
          selected=$(python3 .github/labview/lvpm/worker.py resolve \
            --repo . --action "$ACTION_ID" --repository "$GITHUB_REPOSITORY" --image-name "$IMAGE_OVERRIDE")
          owner=$(printf '%s' "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          name="${IMAGE_OVERRIDE:-${GITHUB_REPOSITORY##*/}-labview}"
          name=$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]')
          verified_lvpm=false
          case "$selected" in
            ''|latest) image="ghcr.io/${owner}/${name}:linux-latest"; worker_workflow="Build LabVIEW CI Image - Linux" ;;
            base|none) image="nationalinstruments/labview:latest-linux"; worker_workflow="" ;;
            linux-lvpm-*@sha256:*) image="ghcr.io/${owner}/${name}:${selected}"; worker_workflow=""; verified_lvpm=true ;;
            linux-*) image="ghcr.io/${owner}/${name}:${selected}"; worker_workflow="Build LabVIEW CI Image - Linux" ;;
            *) image="ghcr.io/${owner}/${name}:linux-${selected}"; worker_workflow="Build LabVIEW CI Image - Linux" ;;
          esac
          echo "LABVIEW_CONTAINER_IMAGE=$image" >> "$GITHUB_ENV"
          echo "LINUX_WORKER_WORKFLOW=$worker_workflow" >> "$GITHUB_ENV"
          echo "LVCI_VERIFIED_LVPM=$verified_lvpm" >> "$GITHUB_ENV"
          echo "Using Linux container image: $image"

      - name: Wait for Linux worker image build
        working-directory: head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$LABVIEW_CONTAINER_IMAGE" = "nationalinstruments/labview:latest-linux" ]; then
            echo "Using the NI Linux base image; no Linux worker build to wait for."
            exit 0
          fi
          if [ "$LVCI_VERIFIED_LVPM" = "true" ]; then
            echo "Using a verified immutable LVPM candidate; no VIPM build to wait for."
            exit 0
          fi
          bash .github/labview/wait-for-worker-image.sh "${{ steps.shas.outputs.head }}" "${{ github.event.before }}" "$LINUX_WORKER_WORKFLOW"

      - name: Get list of changed VI/CTL files
        id: changed
        env:
          INPUT_FILES: ${{ github.event.inputs.files }}
        run: |
          cd head
          if [ -n "$INPUT_FILES" ]; then
            # Targeted run (e.g. a single VI requested from the VI Browser): diff just
            # these paths instead of the whole range. Accept comma- or newline-
            # separated paths and keep only .vi/.ctl entries.
            FILES=$(printf '%s' "$INPUT_FILES" | tr ',' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | grep -iE '\.(vi|ctl)$' || true)
          elif [ -n "${{ steps.shas.outputs.base }}" ]; then
            FILES=$(git diff --name-only "${{ steps.shas.outputs.base }}" "${{ steps.shas.outputs.head }}" -- '*.vi' '*.ctl')
          else
            FILES=$(git diff-tree --no-commit-id -r --name-only "${{ steps.shas.outputs.head }}" -- '*.vi' '*.ctl')
          fi
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: env.LABVIEW_CONTAINER_IMAGE != 'nationalinstruments/labview:latest-linux'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull LabVIEW Linux container
        run: docker pull ${{ env.LABVIEW_CONTAINER_IMAGE }}

      - name: Run VIDiff inside Linux container
        id: diff
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          mkdir -p "${{ github.workspace }}/head/ci-out/vidiff"
          docker run --rm \
            -v "${{ github.workspace }}/head:/workspace" \
            -v "${{ github.workspace }}/base:/workspace-base" \
            -e CHANGED_FILES \
            ${{ env.LABVIEW_CONTAINER_IMAGE }} \
            bash /workspace/.github/labview/vidiff.sh \
              /workspace-base /workspace /workspace/ci-out/vidiff
        continue-on-error: true

      - name: Save metadata
        run: |
          mkdir -p "${{ github.workspace }}/head/ci-out"
          cat > "${{ github.workspace }}/head/ci-out/vidiff-meta.json" <<JSON
          {
            "head_sha":  "${{ steps.shas.outputs.head }}",
            "base_sha":  "${{ steps.shas.outputs.base }}",
            "pr_number": "${{ steps.shas.outputs.pr_number }}",
            "platform":  "linux",
            "outcome":   "${{ steps.diff.outcome }}"
          }
          JSON

      - name: Upload VIDiff report artifact
        uses: actions/upload-artifact@v7
        with:
          name: vidiff-linux-${{ steps.shas.outputs.head }}
          path: |
            ${{ github.workspace }}/head/ci-out/vidiff/
            ${{ github.workspace }}/head/ci-out/vidiff-meta.json
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if diff failed
        if: steps.diff.outcome == 'failure'
        run: exit 1
