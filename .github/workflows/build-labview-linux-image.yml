name: Build LabVIEW CI Image - Linux
run-name: ${{ github.event_name == 'push' && 'Build Linux worker image (monitored dependency change)' || 'Build Linux worker image (apply dependencies)' }}

on:
  # The Linux worker BAKE -- distinct from the install seed, which is the separate
  # copy-labview-linux-image.yml (a fast crane copy of the shared LCWC Linux base).
  # By DEFAULT a project dependency change does NOT rebuild the worker; the user is
  # notified by the dashboard banner and applies the update on demand. A project CAN
  # opt an individual *.vipc into automatic rebuilds via the per-file Monitor toggle
  # (config.container.vipc[].monitor, default false); a push that changes a MONITORED
  # *.vipc then rebuilds and re-pushes the worker -- identical to the Windows worker.
  # The gate enforces this opt-in; the monthly cron rebuilds for base-image security.
  push:
    branches: [main]
    paths:
      # Only a project dependency change (outside the tooling dir) is considered; the
      # gate then rebuilds solely when a changed *.vipc is monitored. Tooling / base
      # changes rebuild via the monthly cron or an explicit dispatch, not a push.
      - '**.vipc'
      - '**.dragon'
      - '!.github/**'
  schedule:
    # Monthly rebuild to pick up NI base image security updates
    - cron: '0 4 1 * *'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Reviewed default-branch commit; reject a changed dispatch target'
        required: false
        default: ''
        type: string
      dependency_sha:
        description: 'Optional full SHA of the committed dependency revision; must be an ancestor of the reviewed HEAD'
        required: false
        default: ''
        type: string
      push_latest:
        description: 'Deprecated -- :linux-latest is always published now (kept for compatibility)'
        type: boolean
        default: true
      update_mode:
        description: 'Dependency update: replace = rebuild the current Linux worker tags in place (actions keep using them automatically); new = publish a new dated tag ALONGSIDE the current one, to select per-action in Configure Workers'
        type: choice
        options: [replace, new]
        default: replace
      release_id:
        description: 'Source repo only: build a specific catalog containers.supported[] release and publish ONLY its linux-<releaseId> tag (the moving linux-2026 / linux-latest tags stay on the default release). Empty = default release.'
        required: false
        default: ''

env:
  # IMAGE_NAME is populated at runtime by the resolve step below (-> $GITHUB_ENV);
  # declared here as empty so it is an always-defined env key.
  IMAGE_NAME: ''
  PAGES_URL: ''
  DEFAULT_TAG: linux-${{ vars.LABVIEW_VERSION || '2026' }}
  # The shared LCWC Linux worker image, owned by the source repo's GHCR. Clients
  # COPY this image into their own GHCR package on install instead of rebuilding it
  # from the NI base -- the Linux analog of LCWC_BASE_IMAGE. The source repo is
  # detected at runtime by deriving the owning repo from this image name, so the
  # installer's branding substitution (which only rewrites the mixed-case project
  # slug) never makes a client think it is the source: the lowercase GHCR reference
  # is left untouched and keeps pointing at LCWC.
  LCWC_LINUX_BASE_IMAGE: ${{ vars.LCWC_LINUX_BASE_IMAGE || 'ghcr.io/elijah286/labview-ci-with-containers-labview:linux-2026' }}

permissions:
  contents: write
  packages: write

concurrency:
  group: build-labview-linux-image
  cancel-in-progress: false

jobs:
  # Decide whether this push should rebuild the worker. Auto-rebuild is per monitored
  # file -- identical to the Windows worker: a push rebuilds only when it
  # changes a *.vipc the project flagged monitor:true in config.container.vipc[].
  # Manual dispatch and the monthly cron always rebuild. Any non-monitored change,
  # and any uncertainty/error, leaves the heavy build for an explicit dispatch (the
  # dashboard banner still flags that dependencies need installing). The install
  # SEED is a separate workflow (copy-labview-linux-image.yml), so nothing here is
  # needed to give a fresh install a worker.
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Verify reviewed commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [ -n "$EXPECTED_SHA" ]; then
            if ! [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::Invalid reviewed commit SHA; expected exactly 40 hexadecimal characters."
              exit 1
            fi
            reviewed_sha=$(printf '%s' "$EXPECTED_SHA" | tr '[:upper:]' '[:lower:]')
            if [ "$GITHUB_SHA" != "$reviewed_sha" ]; then
              echo "::error::Reviewed HEAD moved. Click Update container image again to review the new target."
              exit 1
            fi
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate selected dependency revision
        env:
          DEPENDENCY_SHA: ${{ inputs.dependency_sha || github.sha }}
        run: |
          [[ "$DEPENDENCY_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          git merge-base --is-ancestor "$DEPENDENCY_SHA" "$GITHUB_SHA"
      - name: Install gate configuration parser
        run: python3 -m pip install PyYAML==6.0.3
      - name: Decide whether to rebuild
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, subprocess, pathlib, yaml

          def emit(build, why):
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('build=%s\n' % ('true' if build else 'false'))
              print('rebuild =', build, '--', why)
              raise SystemExit(0)

          try:
              if os.environ.get('EVENT_NAME', '') != 'push':
                  emit(True, 'dispatch/schedule -> always rebuild')
              before = os.environ.get('BEFORE', '') or ''
              sha = os.environ.get('SHA', '') or 'HEAD'
              if not before or set(before) == {'0'}:
                  emit(False, 'no diff base on push -> skip (opt-in)')
              diff = subprocess.run(['git', 'diff', '--name-only', before, sha],
                                    capture_output=True, text=True)
              if diff.returncode != 0:
                  emit(False, 'git diff failed -> skip (opt-in)')
              files = [f for f in diff.stdout.splitlines() if f.strip()]
              dep_changed = [f for f in files
                             if f.lower().endswith(('.vipc', '.dragon'))
                             and not f.replace(os.sep, '/').startswith('.github/')]
              if not dep_changed:
                  emit(False, 'no project dependency changed -> skip')

              # Per-file monitor flags from config.container.vipc (default OFF).
              # This (Linux) worker only auto-rebuilds for a file that is
              # monitor: true AND monitored for Linux (its monitorOn list includes
              # 'linux', or no monitorOn is set = every platform).
              PLATFORM = 'linux'
              cfg = pathlib.Path('.github/labview-ci.yml')
              data = yaml.safe_load(cfg.read_text(encoding='utf-8')) if cfg.exists() else {}
              container = (data.get('config') or {}).get('container', {})
              for entry in container.get('vipc', []) + container.get('dragon', []):
                  on = entry.get('monitorOn')
                  if isinstance(on, str):
                      on = on.split('+')
                  if on is not None and not isinstance(on, list):
                      raise ValueError('monitorOn must be a platform list or + separated string')
                  if (entry.get('monitor') is True and (on is None or PLATFORM in on)
                          and entry.get('path') in dep_changed):
                      emit(True, 'monitored dependency changed: ' + entry['path'])
              emit(False, 'changed dependencies are not monitored for ' + PLATFORM + ' -> skip')
          except SystemExit:
              raise
          except Exception as e:
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('build=false\n')
              print('gate error -> build=false:', e)
          PY

  # Keep the Docker host aligned with native-dependency-validation.yml.
  # ubuntu-latest moved to 26.04; VIPM inventory was qualified on 24.04.
  build-and-push:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Checkout selected dependency revision
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.dependency_sha || github.sha }}
          path: ci-out/linux-source
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up crane (registry copy tool)
        run: |
          ver=v0.20.2
          url="https://github.com/google/go-containerregistry/releases/download/${ver}/go-containerregistry_Linux_x86_64.tar.gz"
          tmp="$(mktemp -d)"
          curl -fsSL "$url" | tar -xz -C "$tmp"
          echo "$tmp" >> "$GITHUB_PATH"
          "$tmp/crane" version

      - name: Resolve image name and date tag
        id: date
        env:
          IMAGE_OVERRIDE: ${{ vars.LABVIEW_IMAGE_NAME }}
          PAGES_URL_OVERRIDE: ${{ vars.PAGES_URL }}
        run: |
          owner=$(printf '%s' "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          name="${IMAGE_OVERRIDE:-${GITHUB_REPOSITORY##*/}-labview}"
          name=$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${owner}/${name}" >> "$GITHUB_ENV"
          echo "PAGES_URL=${PAGES_URL_OVERRIDE:-https://${owner}.github.io/${GITHUB_REPOSITORY##*/}}" >> "$GITHUB_ENV"
          echo "date=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"
          # Derive the source repo that OWNS the shared LCWC Linux base image
          # (ghcr.io/<owner>/<name>-labview -> <owner>/<name>). Only that repo BUILDS
          # the base; every other repo is a client that COPIES it. Deriving the identity
          # from the (lowercase) image name keeps it immune to the installer's branding
          # rewrite, so a client never mistakes itself for the source.
          base_repo="${LCWC_LINUX_BASE_IMAGE%:*}"
          src_slug="${base_repo#*/}"; src_slug="${src_slug%-labview}"
          this_repo="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          if [ "$this_repo" = "$(printf '%s' "$src_slug" | tr '[:upper:]' '[:lower:]')" ]; then
            echo "is_source=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_source=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage repo VIPC files
        id: vipc
        shell: bash
        env:
          FALLBACK_YEAR: ${{ vars.LABVIEW_VERSION || '2026' }}
          DEPENDENCY_SHA: ${{ inputs.dependency_sha || github.sha }}
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 .github/labview/vipm/linux-worker.py stage \
            --root ci-out/linux-source --destination .github/labview/vipm \
            --dependency-sha "$DEPENDENCY_SHA" --output ci-out/linux-vipc-inputs.json
          python3 - <<'PY'
          import os, re, json, pathlib
          plan = json.loads(pathlib.Path('ci-out/linux-vipc-inputs.json').read_text())
          year = plan['labview_version']
          if not re.fullmatch(r'20\d{2}', year):
            raise ValueError('LabVIEW version must be a four-digit year')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
            output.write(f'LABVIEW_VERSION={year}\nDEFAULT_TAG=linux-{year}\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
            out.write(f"count={len(plan['files'])}\n")
          PY
      - name: Compute worker version
        id: ver
        env:
          IS_SOURCE: ${{ steps.date.outputs.is_source }}
          VIPC_COUNT: ${{ steps.vipc.outputs.count }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, os, re, subprocess
          is_source = os.environ.get('IS_SOURCE', '') == 'true'
          year = os.environ['LABVIEW_VERSION']
          catalog = json.loads(pathlib.Path('.github/labview-ci/catalog.json').read_text())['containers']
          release_id = (os.environ.get('RELEASE_ID') if is_source else '') or catalog['default']
          default_release = catalog['default']
          release = next(entry for entry in catalog['supported'] if entry['id'] == release_id)
          if release['status'] != 'qualified' or str(release['labviewYear']) != year:
            raise ValueError('The selected Linux base must be qualified for the configured LabVIEW year')
          base = release['linuxTag']
          if not re.fullmatch(r'nationalinstruments/labview:[a-z0-9.-]+-linux', base) or ':latest' in base:
            raise ValueError('The Linux base must be an explicit NI release tag')
          digest = subprocess.check_output(['crane', 'digest', base], text=True).strip()
          ni_tag = base.split(':', 1)[1] + '@' + digest
          files = [
              pathlib.Path('.github/docker/labview-ci-linux.Dockerfile'),
              pathlib.Path('.github/labview/vipm/install-vipc-linux.sh'),
              pathlib.Path('.github/labview/vipm/linux-worker.py'),
              pathlib.Path('.github/labview/asciidoc-linux-command.py'),
              pathlib.Path('ci-out/linux-vipc-inputs.json'),
          ]
          files += sorted(pathlib.Path('.github/labview/vipm').glob('*.vipc'), key=lambda p: p.name.lower())
          # The VI Browser render engine (lvctl + runner) is baked into this
          # worker, so its source must factor into the version -- an engine change
          # must yield a new worker image on the next dependency build.
          toimages = pathlib.Path('.github/labview/toimages')
          if toimages.is_dir():
            files += sorted((p for p in toimages.rglob('*') if p.is_file()), key=lambda p: p.as_posix().lower())
          parts = []
          for path in files:
            if path.exists():
              parts.append(f'{path.as_posix()}={hashlib.sha256(path.read_bytes()).hexdigest()}')
          if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
            raise ValueError('Cannot resolve the Linux base digest')
          parts += [f'base-image={base}', f'base-digest={digest}', f'labview-version={year}']
          version = 'linux-' + hashlib.sha256('\n'.join(parts).encode('utf-8')).hexdigest()[:12]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            for key, value in {'version': version, 'base_image': base, 'base_digest': digest,
                               'ni_tag': ni_tag, 'release_id': release_id, 'default_release': default_release}.items():
              f.write(f'{key}={value}\n')
          print('Worker version:', version)
          PY

      - name: Build and push LabVIEW Linux CI image
        env:
          VIPM_SERIAL_NUMBER: ${{ secrets.VIPM_SERIAL_NUMBER }}
          VIPM_FULL_NAME: ${{ secrets.VIPM_FULL_NAME }}
          VIPM_EMAIL: ${{ secrets.VIPM_EMAIL }}
          IS_SOURCE: ${{ steps.date.outputs.is_source }}
          VIPC_COUNT: ${{ steps.vipc.outputs.count }}
          UPDATE_MODE: ${{ github.event.inputs.update_mode || 'replace' }}
        run: |
          set -euo pipefail
          base="${{ env.IMAGE_NAME }}"
          tag="${{ env.DEFAULT_TAG }}"
          date_tag="${{ steps.date.outputs.date }}"
          worker_version="${{ steps.ver.outputs.version }}"
          # SOURCE base build, or a deliberate client dependency bake: docker buildx build.
          if [ "${{ github.event.inputs.push_latest }}" = "true" ]; then
            echo "push_latest is kept for compatibility; :linux-latest is always published."
          fi
          secret_flags=()
          if [ -n "${VIPM_SERIAL_NUMBER:-}" ]; then secret_flags+=(--secret id=vipm_serial,env=VIPM_SERIAL_NUMBER); fi
          if [ -n "${VIPM_FULL_NAME:-}" ]; then secret_flags+=(--secret id=vipm_full_name,env=VIPM_FULL_NAME); fi
          if [ -n "${VIPM_EMAIL:-}" ]; then secret_flags+=(--secret id=vipm_email,env=VIPM_EMAIL); fi

          # update_mode mirrors the Windows worker: replace (default) rebuilds the
          # moving tags in place so actions pick up the update automatically; new
          # publishes a fresh dated tag alongside the current worker WITHOUT moving
          # :linux-latest / :<tag>, so users opt in per action in Configure Workers.
          update_mode="${UPDATE_MODE:-replace}"
          if [ "$update_mode" = "new" ]; then
            new_tag="${tag}-deps-${date_tag}"
            image_tags=("${base}:${worker_version}" "${base}:${new_tag}")
          else
            image_tags=("${base}:${tag}" "${base}:${tag}-${date_tag}" "${base}:${worker_version}" "${base}:linux-latest")
          fi

          # The source repo pins the NI container release from the catalog's
          # containers[] default entry (never latest-linux: NI repointed the
          # latest-* tags to 2026 Q3 on 2026-07-27 unannounced -- pinning keeps a
          # container change a deliberate, qualified catalog edit) and also
          # publishes a per-release tag (linux-<releaseId>) so clients pinned to
          # an older container release keep a stable base to copy.
          lv_container_args=(--build-arg LV_CONTAINER_TAG="${{ steps.ver.outputs.ni_tag }}")
          if [ "${IS_SOURCE}" = "true" ]; then
            rel_id="${{ steps.ver.outputs.release_id }}"
            default_rel="${{ steps.ver.outputs.default_release }}"
            if [ "$rel_id" != "$default_rel" ]; then
              # Non-default release: publish ONLY its pinned per-release tag (plus
              # the immutable worker version) -- the moving tags keep tracking the
              # default release so nothing switches containers implicitly.
              image_tags=("${base}:${worker_version}" "${base}:linux-${rel_id}")
            elif [ "$update_mode" != "new" ]; then
              image_tags+=("${base}:linux-${rel_id}")
            fi
          fi
          tag_flags=()
          for t in "${image_tags[@]}"; do tag_flags+=(-t "$t"); done

          docker buildx build \
            --platform linux/amd64 \
            --file .github/docker/labview-ci-linux.Dockerfile \
            --build-arg CI_WORKER_VERSION="${worker_version}" \
            --build-arg LABVIEW_VERSION="${LABVIEW_VERSION}" \
            "${lv_container_args[@]}" \
            "${tag_flags[@]}" \
            "${secret_flags[@]}" \
            --load \
            .

          printf '%s\n' "${image_tags[@]#${base}:}" > ci-out/linux-publish-tags.txt
          docker push "${base}:${worker_version}"

          if [ "$update_mode" = "new" ]; then
            echo "::notice::Pushed immutable Linux worker '${base}:${worker_version}'. Requested aliases will be published only after inventory and manifest verification; existing default worker selection is unchanged."
          fi

      - name: Generate worker manifest
        env:
          IS_SOURCE: ${{ steps.date.outputs.is_source }}
          VIPC_COUNT: ${{ steps.vipc.outputs.count }}
          DEPENDENCY_SHA: ${{ inputs.dependency_sha || github.sha }}
        run: |
          set -euo pipefail
          worker_version="${{ steps.ver.outputs.version }}"
          image_ref="${{ env.IMAGE_NAME }}:${worker_version}"
          image_digest=$(crane digest "$image_ref")
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_ref="$image_ref@$image_digest"
          out_dir="ci-out/workers-pages/workers/linux/${worker_version}"
          mkdir -p ci-out/worker "$out_dir"
          : > ci-out/worker/nipkg-list.txt
          : > ci-out/worker/vipm-list.txt
          : > ci-out/worker/dpkg-list.txt
          vipc_args=()
          layer_args=(--worker-layer repo-vipc-layer)
          base_image="${{ steps.ver.outputs.base_image }}"
          base_digest="${{ steps.ver.outputs.base_digest }}"

          container=$(docker create --entrypoint /bin/true "$image_ref")
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/opt/lvci/vipm/observed-inventory.json" ci-out/worker/observed-inventory.json
          required_args=(--required)
          python3 .github/labview/vipm/linux-worker.py validate --year "$LABVIEW_VERSION" \
            --output ci-out/worker/observed-inventory.json --vipc-dir .github/labview/vipm "${required_args[@]}"
          docker cp "$container:/opt/lvci/vipm/vipm-list.txt" ci-out/worker/vipm-list.txt
          docker run --rm --entrypoint /usr/bin/dpkg-query "$image_ref" -W '-f=${Package} ${Version}\n' > ci-out/worker/dpkg-list.txt
          test -s ci-out/worker/dpkg-list.txt
          while IFS= read -r -d '' vipc_file; do
            vipc_args+=(--vipc "$vipc_file")
          done < <(find .github/labview/vipm -maxdepth 1 -type f -iname '*.vipc' -print0 | sort -z)
          cp ci-out/worker/observed-inventory.json "$out_dir/observed-inventory.json"
          cp ci-out/linux-vipc-inputs.json "$out_dir/dependency-inputs.json"

          python3 .github/labview/build-worker-manifest.py \
            --platform linux \
            --version "$worker_version" \
            --nipkg-list ci-out/worker/nipkg-list.txt \
            --dpkg-list ci-out/worker/dpkg-list.txt \
            --vipm-list ci-out/worker/vipm-list.txt \
            --observed-inventory ci-out/worker/observed-inventory.json \
            --labview-version "${LABVIEW_VERSION}" \
            --labview-bitness 64 \
            --pages-url "${{ env.PAGES_URL }}" \
            --base-image "$base_image" \
            --base-digest "$base_digest" \
            --image-ref "$image_ref" \
            --git-sha "${{ github.sha }}" \
            --dependency-sha "$DEPENDENCY_SHA" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --out-dir "$out_dir" \
            "${layer_args[@]}" \
            "${vipc_args[@]}"
          printf '%s\n' "$image_ref" > ci-out/linux-verified-image.txt

          if [ "${{ github.event.inputs.update_mode || 'replace' }}" != "new" ] && [ "${{ steps.ver.outputs.release_id }}" = "${{ steps.ver.outputs.default_release }}" ]; then
          cat > "ci-out/workers-pages/workers/linux/latest.json" <<JSON
          {
            "version": "$worker_version",
            "platform": "linux",
            "manifest_url": "${{ env.PAGES_URL }}/workers/linux/$worker_version/manifest.html",
            "build_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "git_sha": "${{ github.sha }}"
          }
          JSON
          fi

      - name: Publish verified Linux worker aliases
        run: |
          set -euo pipefail
          image_ref=$(cat ci-out/linux-verified-image.txt)
          while IFS= read -r tag; do
            crane tag "$image_ref" "$tag"
            echo "Published verified image: ${IMAGE_NAME}:${tag}"
          done < ci-out/linux-publish-tags.txt

      - name: Retain native Linux dependency and installed inventory evidence
        uses: actions/upload-artifact@v7
        with:
          name: linux-vipm-evidence
          path: |
            ci-out/linux-vipc-inputs.json
            ci-out/worker/

      - name: Publish worker manifest to GitHub Pages
        uses: ./.github/actions/publish-gh-pages
        with:
          publish_dir: ci-out/workers-pages
          commit_message: Publish Linux worker manifest
      - name: Summary
        run: |
          echo "### Docker image published" >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r tag; do
            echo "- \`${{ env.IMAGE_NAME }}:${tag}\`" >> "$GITHUB_STEP_SUMMARY"
          done < ci-out/linux-publish-tags.txt
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Worker version:** \`${{ steps.ver.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "[Worker manifest](${{ env.PAGES_URL }}/workers/linux/${{ steps.ver.outputs.version }}/manifest.html)" >> "$GITHUB_STEP_SUMMARY"
